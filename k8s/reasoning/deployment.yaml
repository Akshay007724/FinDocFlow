apiVersion: apps/v1
kind: Deployment
metadata:
  name: reasoning
  namespace: findocflow
  labels:
    app: reasoning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reasoning
  template:
    metadata:
      labels:
        app: reasoning
    spec:
      containers:
        - name: reasoning
          image: findocflow/reasoning:latest
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: findocflow-config
            - secretRef:
                name: findocflow-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: reasoning
  namespace: findocflow
spec:
  selector:
    app: reasoning
  ports:
    - port: 8004
      targetPort: 8004
