apiVersion: apps/v1
kind: Deployment
metadata:
  name: extraction
  namespace: findocflow
  labels:
    app: extraction
spec:
  replicas: 1
  selector:
    matchLabels:
      app: extraction
  template:
    metadata:
      labels:
        app: extraction
    spec:
      containers:
        - name: extraction
          image: findocflow/extraction:latest
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: findocflow-config
            - secretRef:
                name: findocflow-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: extraction
  namespace: findocflow
spec:
  selector:
    app: extraction
  ports:
    - port: 8002
      targetPort: 8002
