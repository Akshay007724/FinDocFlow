apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: findocflow
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: findocflow/frontend:latest
          ports:
            - containerPort: 8501
          envFrom:
            - configMapRef:
                name: findocflow-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: findocflow
spec:
  selector:
    app: frontend
  ports:
    - port: 8501
      targetPort: 8501
  type: LoadBalancer
