apiVersion: apps/v1
kind: Deployment
metadata:
  name: entity-linking
  namespace: findocflow
  labels:
    app: entity-linking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: entity-linking
  template:
    metadata:
      labels:
        app: entity-linking
    spec:
      containers:
        - name: entity-linking
          image: findocflow/entity-linking:latest
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: findocflow-config
            - secretRef:
                name: findocflow-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 45
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 30
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: entity-linking
  namespace: findocflow
spec:
  selector:
    app: entity-linking
  ports:
    - port: 8003
      targetPort: 8003
