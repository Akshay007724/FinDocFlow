version: "3.9"

x-common-env: &common-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_TOPIC_RAW: raw_documents
  KAFKA_TOPIC_EXTRACTED: extracted_documents
  KAFKA_TOPIC_LINKED: linked_documents
  REDIS_URL: redis://redis:6379
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: findocflow
  MINIO_ENDPOINT: http://minio:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  ICEBERG_WAREHOUSE: s3a://findocflow/warehouse
  OLLAMA_BASE_URL: http://ollama:11434
  OLLAMA_MODEL: llava
  LOG_LEVEL: INFO
  CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:8501,http://frontend-next:3000,http://frontend:8501"

services:
  # ── Infrastructure ─────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 52428800
      KAFKA_REPLICA_FETCH_MAX_BYTES: 52428800
      CLUSTER_ID: _M12daWRSC2PEliFYzsGFg
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  neo4j:
    image: neo4j:5.20-community
    environment:
      NEO4J_AUTH: neo4j/findocflow
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Services ───────────────────────────────────────────────────────────────
  ingestion:
    build:
      context: services/ingestion_service
    environment:
      <<: *common-env
    ports:
      - "8001:8001"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_started

  extraction:
    build:
      context: services/extraction_service
    environment:
      <<: *common-env
    ports:
      - "8002:8002"
    depends_on:
      - kafka
      - ingestion

  entity-linking:
    build:
      context: services/entity_linking_service
    environment:
      <<: *common-env
    ports:
      - "8003:8003"
    depends_on:
      - kafka
      - neo4j
      - extraction

  reasoning:
    build:
      context: services/reasoning_service
    environment:
      <<: *common-env
    ports:
      - "8004:8004"
    depends_on:
      - ollama

  frontend:
    build:
      context: services/frontend
    environment:
      <<: *common-env
    ports:
      - "8501:8501"
    depends_on:
      - ingestion
      - reasoning
      - entity-linking

  frontend-next:
    build:
      context: services/frontend-next
    environment:
      NEXT_PUBLIC_INGESTION_URL: http://ingestion:8001
      NEXT_PUBLIC_EXTRACTION_URL: http://extraction:8002
      NEXT_PUBLIC_ENTITY_LINKING_URL: http://entity-linking:8003
      NEXT_PUBLIC_REASONING_URL: http://reasoning:8004
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - ingestion
      - reasoning
      - entity-linking
      - extraction

volumes:
  kafka-data:
  redis-data:
  neo4j-data:
  minio-data:
  ollama-models:
