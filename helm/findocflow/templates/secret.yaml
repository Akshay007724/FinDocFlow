apiVersion: v1
kind: Secret
metadata:
  name: {{ include "findocflow.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "findocflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  NEO4J_PASSWORD: {{ .Values.neo4j.password | quote }}
  MINIO_ACCESS_KEY: {{ .Values.minio.accessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.minio.secretKey | quote }}
